# Exemple de configuration Nginx (à placer dans /etc/nginx/sites-available/beyassa).
# Remplacer beyassa.exemple.org par le vrai nom de domaine, puis :
#   sudo ln -s /etc/nginx/sites-available/beyassa /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d beyassa.exemple.org

server {
    listen 80;
    server_name beyassa.exemple.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beyassa.exemple.org;

    # Lignes ajoutées automatiquement par certbot :
    # ssl_certificate     /etc/letsencrypt/live/beyassa.exemple.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/beyassa.exemple.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Le jeton du QR code ne doit pas apparaître dans les journaux.
    location /acces/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
